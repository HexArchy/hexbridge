name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Отменяем предыдущий прогон той же ветки: смысла собирать устаревший коммит нет.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Кодек берём готовый: собирать libopus из исходников на каждый прогон дорого,
      # а Package.swift и так умеет искать его по OPUS_PREFIX.
      - name: Install libopus
        run: brew install opus

      # --disable-keychain --disable-netrc: все зависимости публичные, а без этих
      # флагов SwiftPM спрашивает у Keychain пароль для хоста с бинарным артефактом
      # Sparkle и на машине, где Keychain не может показать диалог, зависает молча.
      - name: Build
        run: swift build -c release --package-path mac --disable-keychain --disable-netrc

      - name: Tests
        run: bash mac/scripts/test.sh

      - name: Smoke-test the CLI
        run: |
          BIN=mac/.build/release/HexBridge
          "$BIN" help > /dev/null
          # keygen должен выдавать ровно 32 байта в base64
          KEY=$("$BIN" keygen)
          [ ${#KEY} -eq 44 ] || { echo "keygen вернул ключ длиной ${#KEY}, ожидалось 44"; exit 1; }
          "$BIN" list-devices || true   # на раннере может не быть устройств ввода

      - name: Build .app
        run: bash mac/scripts/build-app.sh

      - name: Archive
        run: ditto -c -k --keepParent mac/build/HexBridge.app HexBridge-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HexBridge-macOS
          path: HexBridge-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build win/src/HexBridge.sln -c Release --no-incremental

      # Тесты протокола USB/IP — единственный способ проверить разбор пакетов,
      # не имея под рукой vhci-драйвера.
      - name: Tests
        run: dotnet test win/src/HexBridge.sln -c Release --no-build --verbosity normal

      - name: Publish the app
        run: >
          dotnet publish win/src/HexBridge.App -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true -o publish/app

      - name: Publish the console receiver
        run: >
          dotnet publish win/HexBridge.Receiver.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true -o publish/cli

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item publish/app/* package/ -Recurse -Force
          Copy-Item publish/cli/HexBridge.Receiver.exe package/ -Force
          Copy-Item win/scripts/install.ps1 package/ -Force
          Copy-Item win/scripts/install-task.ps1 package/ -Force
          Copy-Item win/scripts/README.txt package/ -Force
          Get-ChildItem package -Filter *.pdb | Remove-Item -Force
          Compress-Archive -Path package/* -DestinationPath HexBridge-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: HexBridge-Windows
          path: HexBridge-Windows.zip
          if-no-files-found: error

  relay:
    name: Relay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: relay/go.sum

      - name: Vet and build
        working-directory: relay
        run: |
          go vet ./...
          # Релей ставится и на не-amd64 VPS, поэтому проверяем обе цели.
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../hexbridge-relay-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../hexbridge-relay-linux-arm64 .

      - uses: actions/upload-artifact@v4
        with:
          name: HexBridge-relay
          path: hexbridge-relay-linux-*
          if-no-files-found: error

  # Образ релея. Собирается здесь, а сервер его только тянет: у сервера нет ни
  # исходников, ни Go, и обновление там должно быть «docker compose pull», а не
  # сборка. `latest` двигается на каждый main, теги — на каждый релиз.
  image:
    name: Relay image
    needs: relay
    # Только на main: на пулл-реквесте нечего публиковать, а права на пакеты
    # форку не выдаются.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 рядом с amd64: релей ставят и на ARM-хостинг, а собрать обе
      # архитектуры здесь стоит минуту и избавляет сервер от выбора.
      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hexarchy/hexbridge-relay:latest
            ghcr.io/hexarchy/hexbridge-relay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Однажды ключ уже чуть не уехал в репозиторий внутри собранного пакета.
      # Дешевле ловить это в CI, чем вычищать из истории.
      - name: Look for keys and configs in the tree
        run: |
          set -e
          fail=0

          if git ls-files | grep -E '(^|/)(config|ui)\.json$'; then
            echo "::error::config.json или ui.json попал в репозиторий — там живут ключи"
            fail=1
          fi

          if git ls-files | grep -E '\.(zip|exe|dmg)$'; then
            echo "::error::в репозитории собранные артефакты, их место в релизах"
            fail=1
          fi

          # Приватный ключ подписи обновлений. Если он утечёт, кто угодно сможет
          # подписать «обновление» HexBridge, и Sparkle его молча поставит.
          if git ls-files | grep -E '(^|/)secrets/|_private_key$'; then
            echo "::error::в репозитории приватный ключ подписи обновлений — см. docs/UPDATES.md"
            fail=1
          fi

          # 32 байта в base64 — ровно та форма, в которой хранится PSK.
          if git grep -nIE '"[Pp]sk"[[:space:]]*:[[:space:]]*"[A-Za-z0-9+/]{43}="' -- . ; then
            echo "::error::в тексте найден ключ, похожий на настоящий PSK"
            fail=1
          fi

          exit $fail
