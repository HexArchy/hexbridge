name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для релиза, например v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: brew install opus

      # The tag drives both version strings in the bundle. CFBundleVersion has to
      # increase with every release or Sparkle offers the update to nobody.
      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Swift tests
        run: bash mac/scripts/test.sh

      - name: Build the app
        env:
          HEXBRIDGE_VERSION: ${{ steps.version.outputs.value }}
        run: bash mac/scripts/build-app.sh

      - name: Archive
        run: ditto -c -k --keepParent mac/build/HexBridge.app HexBridge-macOS-arm64.zip

      # The appcast is built here and not in the publish job, for two reasons:
      # `sign_update` is a macOS binary, and the archive it signs exists only on
      # this runner. What travels onward is the signature, never the key.
      - name: Build the Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # A fork, or a repository whose owner has not set the secret, should still
          # get a release with working apps in it. Only the macOS update channel
          # needs the key, so its absence skips that one step and says so loudly
          # rather than failing the whole release.
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not set — this release ships without a signed macOS update feed, so Sparkle will not offer it. See docs/UPDATES.md."
            exit 0
          fi
          bash mac/scripts/make-appcast.sh \
            "${{ steps.version.outputs.value }}" \
            HexBridge-macOS-arm64.zip \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/HexBridge-macOS-arm64.zip" \
            appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          # appcast.xml is absent when the signing secret is not configured.
          if-no-files-found: warn
          path: |
            HexBridge-macOS-arm64.zip
            appcast.xml

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test win/src/HexBridge.sln -c Release
      - name: Publish
        run: |
          dotnet publish win/src/HexBridge.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish/app
          dotnet publish win/HexBridge.Receiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish/cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item publish/app/* package/ -Recurse -Force
          Copy-Item publish/cli/HexBridge.Receiver.exe package/ -Force
          Copy-Item win/scripts/install.ps1 package/ -Force
          Copy-Item win/scripts/install-task.ps1 package/ -Force
          Copy-Item win/scripts/README.txt package/ -Force
          Get-ChildItem package -Filter *.pdb | Remove-Item -Force
          Compress-Archive -Path package/* -DestinationPath HexBridge-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: HexBridge-Windows-x64.zip

  # Velopack cross-compiles: `vpk [win] pack -r win-x64` builds the Windows
  # installer and the update channel on a Mac runner. It is a separate job from
  # `windows` on purpose — that one produces the portable zip people carry to the
  # gaming PC on a stick, this one produces the thing that updates itself.
  velopack:
    name: Windows installer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Pinned to the same version as the Velopack package reference in
      # HexBridge.App.csproj: the tool writes the release metadata the library
      # reads, and a mismatch shows up as an update that never applies.
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Publish for win-x64
        run: |
          dotnet publish win/src/HexBridge.App -c Release -r win-x64 --self-contained true -o publish/win

      - name: Build the Velopack package
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          vpk '[win]' pack \
            --packId HexBridge \
            --packVersion "${{ steps.version.outputs.value }}" \
            --packDir publish/win \
            --mainExe HexBridge.exe \
            --packTitle HexBridge \
            --packAuthors HexArchy \
            -r win-x64 \
            -o velopack

      - uses: actions/upload-artifact@v4
        with:
          name: velopack
          path: |
            velopack/HexBridge-win-Setup.exe
            velopack/*.nupkg
            velopack/RELEASES
            velopack/releases.win.json

  relay:
    name: Relay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build both architectures
        working-directory: relay
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../hexbridge-relay-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../hexbridge-relay-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: relay
          path: hexbridge-relay-linux-*

  publish:
    name: Publish the release
    needs: [macos, windows, velopack, relay]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Контрольные суммы нужны не для галочки: пакет с приёмником пользователь
      # переносит на игровой ПК вручную, и это единственный способ убедиться,
      # что доехало то же самое. appcast.xml в них не участвует: он сам подписан
      # EdDSA, и его контрольная сумма ничего не добавляет.
      - name: Compute checksums
        working-directory: artifacts
        run: sha256sum $(ls | grep -v '^appcast.xml$') > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Both update channels are release assets, and both are reached by a URL
      # that never changes: `releases/latest/download/appcast.xml` for Sparkle,
      # and the repository itself for Velopack, which reads the newest release.
      - name: Check the update channels were produced
        working-directory: artifacts
        run: |
          # Windows update channel is always required; the macOS feed only when the
          # signing secret exists, since without it there is nothing to sign with.
          required="HexBridge-win-Setup.exe RELEASES releases.win.json"
          if [ -n "${{ secrets.SPARKLE_PRIVATE_KEY }}" ]; then
            required="appcast.xml $required"
          fi
          for f in $required; do
            if [ ! -f "$f" ]; then
              echo "::error::the release is missing $f — updates would fail silently"
              exit 1
            fi
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "HexBridge $TAG" \
            --generate-notes \
            artifacts/*
